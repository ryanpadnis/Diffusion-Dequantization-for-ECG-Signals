[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ee269project"
version = "0.1.0"
description = "VitalDB analysis project for EE269"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vitaldb>=1.5.8",
    "matplotlib>=3.2.2",
    "numpy>=2.0.0",
    "pandas>=2.3.0",
    "scipy>=1.13.0",
    "torch>=2.8.0",
    "polars>=1.0.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*"]
